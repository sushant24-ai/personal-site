    <meta name="description" content="AI Daily News - 5 handpicked AI links each day to make you a sharper operator.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .news-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .news-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .news-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .news-header {
            margin-bottom: 3rem;
        }

        .news-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .news-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .news-subtitle a {
            color: var(--accent);
            text-decoration: none;
        }

        .news-subtitle a:hover {
            text-decoration: underline;
        }

        .news-date {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .news-item {
            margin-bottom: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .news-number {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            min-width: 1.5rem;
        }

        .news-link {
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
            line-height: 1.5;
            transition: color 0.2s;
        }

        .news-link:hover {
            color: var(--accent);
        }

        .news-source {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-left: 0.25rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .news-footer-note {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .refresh-link {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }

        .refresh-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="news-page">

    <nav class="nav">
        <div class="container">
            <a href="index.html" class="nav-brand">Sushant Sikare</a>
            <ul class="nav-links">
                <li><a href="index.html">Blog</a></li>
                <li><a href="news.html" class="active">AI News</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()"
                        aria-label="Toggle theme">🌙</button></li>

    <!-- Main Content -->
    <main class="news-main">

                <h1 class="news-title">5 AI links each day to make you a sharper operator.</h1>
                <p class="news-subtitle">Curated by <a href="https://x.com/SikareSushant" target="_blank">Sushant
                        Sikare</a></p>
            </div>

            <div id="newsContent">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading today's links...</p>
                </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">

                    <a href="mailto:sushantshikare24@gmail.com">Mail</a>

                    <a href="https://www.linkedin.com/in/sushant-s-31b799224/" target="_blank">LinkedIn</a>
                    <a href="https://github.com/sushant24-ai" target="_blank">GitHub</a>

                <p class="footer-copy">Sushant Sikare © 2026</p>
            </div>
        </div>

    <script src="js/main.js"></script>
    <script>
        // AI-related keywords
        const AI_KEYWORDS = [
            'ai', 'artificial intelligence', 'machine learning', 'ml', 'deep learning',
            'neural network', 'llm', 'gpt', 'chatgpt', 'openai', 'anthropic', 'claude',
            'gemini', 'transformer', 'nlp', 'computer vision', 'langchain', 'rag',
            'vector database', 'embedding', 'fine-tuning', 'hugging face', 'diffusion',
            'stable diffusion', 'midjourney', 'dall-e', 'llama', 'mistral', 'copilot',
            'agent', 'agentic', 'nvidia', 'cuda', 'pytorch', 'tensorflow',
            'prompt', 'inference', 'training', 'benchmark', 'mcp', 'reasoning',
            'sora', 'deepseek', 'perplexity', 'cursor', 'windsurf', 'v0', 'devin'
        ];

        // High-value keywords get bonus scores
        const HIGH_VALUE_KEYWORDS = {
            'openai': 3, 'gpt-5': 5, 'gpt': 2, 'claude': 3, 'gemini': 3,
            'llama': 2, 'mistral': 2, 'anthropic': 3, 'deepseek': 3,
            'sora': 3, 'agent': 2, 'agentic': 2, 'reasoning': 2, 'devin': 3
        };

        function calculateScore(story) {
            const hoursOld = (Date.now() - story.time * 1000) / (1000 * 60 * 60);
            const titleLower = story.title.toLowerCase();

            let score = story.score || 0;

            let keywordBonus = 1;
            for (const [keyword, bonus] of Object.entries(HIGH_VALUE_KEYWORDS)) {
                if (titleLower.includes(keyword)) {
                    keywordBonus += bonus * 0.1;
                }
            }

            const recencyFactor = Math.max(0.5, 1 - (hoursOld / 48));
            const commentsBonus = Math.log10((story.descendants || 0) + 1) * 0.2 + 1;

            return (score * recencyFactor * keywordBonus * commentsBonus) / Math.sqrt(hoursOld + 2);
        }

        async function fetchNews() {
            const container = document.getElementById('newsContent');
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading today's links...</p>
                </div>
            `;

            try {
                const [topRes, newRes] = await Promise.all([
                    fetch('https://hacker-news.firebaseio.com/v0/topstories.json'),
                    fetch('https://hacker-news.firebaseio.com/v0/newstories.json')
                ]);

                const topIds = await topRes.json();
                const newIds = await newRes.json();

                const allIds = [...new Set([...topIds.slice(0, 100), ...newIds.slice(0, 50)])];

                const storyPromises = allIds.map(id =>
                    fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())
                );
                const stories = await Promise.all(storyPromises);

                const aiStories = stories.filter(story => {
                    if (!story || !story.title) return false;
                    const titleLower = story.title.toLowerCase();
                    return AI_KEYWORDS.some(keyword => titleLower.includes(keyword));
                });

                const scoredStories = aiStories.map(story => ({
                    ...story,
                    smartScore: calculateScore(story)
                })).sort((a, b) => b.smartScore - a.smartScore);

                const top5 = scoredStories.slice(0, 5);

                renderNews(top5);

            } catch (error) {
                container.innerHTML = `
                    <p style="color: var(--text-secondary);">Failed to load. <a class="refresh-link" onclick="fetchNews()">Try again</a></p>
                `;
                console.error('Error fetching news:', error);
            }
        }

        function renderNews(stories) {
            const container = document.getElementById('newsContent');

            if (stories.length === 0) {
                container.innerHTML = `<p style="color: var(--text-secondary);">No AI stories found. <a class="refresh-link" onclick="fetchNews()">Refresh</a></p>`;
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-IN', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                timeZone: 'Asia/Kolkata'
            });

            let html = `
                <div class="news-date">📅 ${dateStr}</div>
                <ol class="news-list">
            `;

            stories.forEach((story, index) => {
                const domain = story.url
                    ? new URL(story.url).hostname.replace('www.', '')
                    : 'news.ycombinator.com';

                html += `
                    <li class="news-item">
                        <span class="news-number">${index + 1}.</span>
                        <div>
                            <a href="${story.url || `https://news.ycombinator.com/item?id=${story.id}`}" 
                               target="_blank" 
                               class="news-link">
                                ${story.title}
                            </a>
                            <span class="news-source">(${domain})</span>
                        </div>
                    </li>
                `;
            });

            html += `
                </ol>
                <div class="news-footer-note">
                    Auto-curated from Hacker News · <a class="refresh-link" onclick="fetchNews()">↻ Refresh</a>
                </div>
            `;

            container.innerHTML = html;
        }

        // Initial load
        fetchNews();

        // Auto-refresh every 30 minutes
        setInterval(fetchNews, 30 * 60 * 1000);
    </script>
</body>

</html>
