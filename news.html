<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="Daily AI News - 5 handpicked AI links each day curated by Sushant Sikare.">
    <title>Daily AI News - Sushant Sikare</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        .news-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .news-main {
            flex: 1;
            padding: 2rem 0;
        }

        .news-hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .news-hero h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        .news-hero p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .news-hero a {
            color: var(--accent);
            text-decoration: none;
        }

        .news-hero a:hover {
            text-decoration: underline;
        }

        /* Day sections */
        .day-section {
            margin-bottom: 2.5rem;
        }

        .day-header {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
        }

        /* Card layout */
        .news-card {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .news-card:hover {
            transform: translateX(4px);
        }

        .news-card:hover .card-title {
            text-decoration: underline;
        }

        /* Thumbnail */
        .card-thumb {
            width: 170px;
            min-width: 170px;
            height: 110px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--border);
            flex-shrink: 0;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-thumb-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Body */
        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.3rem;
            line-height: 1.35;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.45;
            margin-bottom: 0.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-source {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .news-card {
                flex-direction: column;
                gap: 0.75rem;
            }

            .card-thumb {
                width: 100%;
                min-width: unset;
                height: 160px;
            }
        }
    </style>
</head>

<body class="news-page">
    <!-- Navigation -->
    <nav class="nav">
        <div class="container">
            <a href="index.html" class="nav-brand">Sushant Sikare</a>
            <ul class="nav-links">
                <li><a href="index.html">Blog</a></li>
                <li><a href="news.html" class="active">Daily AI News</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()"
                        aria-label="Toggle theme">🌙</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="news-main">
        <div class="container" style="max-width: 720px;">

            <div class="news-hero">
                <h1>Daily AI News</h1>
                <p>5 handpicked AI links each day · Curated by <a href="https://x.com/SikareSushant"
                        target="_blank">Sushant Sikare</a></p>
            </div>

            <div id="newsContent"></div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="mailto:sushantshikare24@gmail.com">Mail</a>
                    <a href="https://x.com/SikareSushant" target="_blank">X</a>
                    <a href="https://www.linkedin.com/in/sushant-s-31b799224/" target="_blank">LinkedIn</a>
                    <a href="https://github.com/sushant24-ai" target="_blank">GitHub</a>

                <p class="footer-copy">Sushant Sikare © 2026</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js?v=3"></script>
    <script>
        // ====== Gradient colors for thumbnails without images ======
        const GRADIENTS = [
            ['#667eea', '#764ba2'], ['#f093fb', '#f5576c'], ['#4facfe', '#00f2fe'],
            ['#43e97b', '#38f9d7'], ['#fa709a', '#fee140'], ['#a18cd1', '#fbc2eb'],
            ['#ff9a9e', '#fecfef'], ['#a1c4fd', '#c2e9fb'], ['#84fab0', '#8fd3f4'],
            ['#fccb90', '#d57eeb'], ['#d4fc79', '#96e6a1'], ['#ffecd2', '#fcb69f']
        ];

        function hashStr(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
            return Math.abs(h);
        }

        function getGradient(domain) {
            const [a, b] = GRADIENTS[hashStr(domain) % GRADIENTS.length];
            return `linear-gradient(135deg, ${a}, ${b})`;
        }

        function getAbbr(domain) {
            return domain.replace(/\.(com|org|io|dev|ai|co|net)$/, '').split('.').pop().substring(0, 2).toUpperCase();
        }

        function formatDayLabel(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
            const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());

            if (target.getTime() === today.getTime()) return 'Today';
            if (target.getTime() === yesterday.getTime()) return 'Yesterday';
            return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        }

        function renderThumb(item) {
            if (item.image) {
                return `<img src="${item.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-thumb-placeholder\\' style=\\'background:${getGradient(item.source)}\\'>${getAbbr(item.source)}</div>'">`;
            }
            return `<div class="card-thumb-placeholder" style="background:${getGradient(item.source)}">${getAbbr(item.source)}</div>`;
        }

        // ====== Load and render from static JSON ======
        function render(data) {
            const container = document.getElementById('newsContent');
            const days = Object.keys(data.days).sort((a, b) => b.localeCompare(a));

            if (days.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-secondary)">No news available.</p>';
                return;
            }

            let html = '';
            days.forEach(day => {
                const items = data.days[day];
                html += `<div class="day-section"><div class="day-header">${formatDayLabel(day)}</div>`;
                items.forEach(item => {
                    const desc = item.description || '';
                    const stats = item.stats || '';
                    const displayDesc = desc.length > 10 ? desc : stats;

                    html += `
                        <a href="${item.url}" target="_blank" rel="noopener" class="news-card">
                            <div class="card-thumb">${renderThumb(item)}</div>
                            <div class="card-body">
                                <div class="card-title">${item.title}</div>
                                ${displayDesc ? `<div class="card-desc">${displayDesc}</div>` : ''}
                                <div class="card-source">${item.source}</div>
                            </div>
                        </a>`;
                });
                html += '</div>';
            });

            container.innerHTML = html;
        }

        // Load the pre-generated JSON — instant, no API wait
        fetch('news-data.json')
            .then(r => r.json())
            .then(render)
            .catch(() => {
                document.getElementById('newsContent').innerHTML =
                    '<p style="text-align:center;color:var(--text-secondary)">News data not available yet.</p>';
            });
    </script>
</body>

</html>
