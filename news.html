<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="Daily AI News - 5 handpicked AI links each day curated by Sushant Sikare.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .news-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .news-main {
            flex: 1;
            padding: 2rem 0;
        }

        .news-hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .news-hero h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        .news-hero p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .news-hero a {
            color: var(--accent);
            text-decoration: none;
        }

        .news-hero a:hover {
            text-decoration: underline;
        }

        /* Day sections */
        .day-section {
            margin-bottom: 2.5rem;
        }

        .day-header {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
        }

        /* Card layout */
        .news-card {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .news-card:hover {
            transform: translateX(4px);
            opacity: 0.9;
        }

        .card-thumb {
            width: 160px;
            min-width: 160px;
            height: 105px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-thumb-gradient {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.35rem;
            line-height: 1.35;
        }

        .card-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.45;
            margin-bottom: 0.35rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-source {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* Loading */
        .loading-container {
            text-align: center;
            padding: 3rem 0;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .news-card {
                flex-direction: column;
                gap: 0.75rem;
            }

            .card-thumb {
                width: 100%;
                min-width: unset;
                height: 140px;
            }
        }
    </style>
</head>

<body class="news-page">
    <!-- Navigation -->
    <nav class="nav">
        <div class="container">
            <a href="index.html" class="nav-brand">Sushant Sikare</a>
            <ul class="nav-links">
                <li><a href="index.html">Blog</a></li>
                <li><a href="news.html" class="active">Daily AI News</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()"
                        aria-label="Toggle theme">🌙</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="news-main">
        <div class="container" style="max-width: 720px;">

            <div class="news-hero">
                <h1>Daily AI News</h1>
                <p>5 handpicked AI links each day · Curated by <a href="https://x.com/SikareSushant"
                        target="_blank">Sushant Sikare</a></p>
            </div>

            <div id="newsContent">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">Loading today's links...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="mailto:sushantshikare24@gmail.com">Mail</a>
                    <a href="https://x.com/SikareSushant" target="_blank">X</a>
                    <a href="https://www.linkedin.com/in/sushant-s-31b799224/" target="_blank">LinkedIn</a>
                    <a href="https://github.com/sushant24-ai" target="_blank">GitHub</a>
                </div>
                <p class="footer-copy">Sushant Sikare © 2026</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // ====== AI Keywords for filtering ======
        const AI_KEYWORDS = [
            'ai', 'artificial intelligence', 'machine learning', 'ml', 'deep learning',
            'neural network', 'llm', 'gpt', 'chatgpt', 'openai', 'anthropic', 'claude',
            'gemini', 'transformer', 'nlp', 'computer vision', 'langchain', 'rag',
            'vector database', 'embedding', 'fine-tuning', 'hugging face', 'diffusion',
            'stable diffusion', 'midjourney', 'dall-e', 'llama', 'mistral', 'copilot',
            'agent', 'agentic', 'nvidia', 'cuda', 'pytorch', 'tensorflow',
            'prompt', 'inference', 'training', 'benchmark', 'mcp', 'reasoning',
            'sora', 'deepseek', 'perplexity', 'cursor', 'windsurf', 'v0', 'devin',
            'multimodal', 'vision model', 'text-to', 'image generation', 'foundation model'
        ];

        const HIGH_VALUE = {
            'openai': 3, 'gpt': 2, 'claude': 3, 'gemini': 3, 'anthropic': 3,
            'deepseek': 3, 'llama': 2, 'mistral': 2, 'agent': 2, 'agentic': 2,
            'reasoning': 2, 'devin': 3, 'sora': 3, 'foundation model': 2
        };

        // ====== Gradient colors for thumbnails ======
        const GRADIENTS = [
            ['#667eea', '#764ba2'],
            ['#f093fb', '#f5576c'],
            ['#4facfe', '#00f2fe'],
            ['#43e97b', '#38f9d7'],
            ['#fa709a', '#fee140'],
            ['#a18cd1', '#fbc2eb'],
            ['#ffecd2', '#fcb69f'],
            ['#ff9a9e', '#fecfef'],
            ['#a1c4fd', '#c2e9fb'],
            ['#d4fc79', '#96e6a1'],
            ['#84fab0', '#8fd3f4'],
            ['#fccb90', '#d57eeb']
        ];

        function hashStr(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
            return Math.abs(h);
        }

        function getDomain(url) {
            try { return new URL(url).hostname.replace('www.', ''); } catch { return ''; }
        }

        function getGradient(domain) {
            const idx = hashStr(domain) % GRADIENTS.length;
            const [a, b] = GRADIENTS[idx];
            return `linear-gradient(135deg, ${a}, ${b})`;
        }

        function getDomainAbbr(domain) {
            const parts = domain.replace('.com', '').replace('.org', '').replace('.io', '').replace('.dev', '').replace('.ai', '').split('.');
            const name = parts[parts.length - 1] || parts[0];
            return name.substring(0, 2).toUpperCase();
        }

        // ====== Scoring ======
        function scoreStory(story) {
            const hoursOld = (Date.now() - story.time * 1000) / 3.6e6;
            const titleLow = story.title.toLowerCase();
            let kwBonus = 1;
            for (const [kw, bonus] of Object.entries(HIGH_VALUE)) {
                if (titleLow.includes(kw)) kwBonus += bonus * 0.1;
            }
            const recency = Math.max(0.3, 1 - hoursOld / 72);
            const engagement = Math.log10((story.descendants || 0) + 1) * 0.15 + 1;
            return ((story.score || 0) * recency * kwBonus * engagement) / Math.sqrt(hoursOld + 2);
        }

        // ====== Date helpers ======
        function toISTDateStr(ts) {
            return new Date(ts * 1000).toLocaleDateString('en-IN', {
                timeZone: 'Asia/Kolkata',
                year: 'numeric', month: '2-digit', day: '2-digit'
            });
        }

        function formatDayLabel(dateKey) {
            const parts = dateKey.split('/');
            const d = new Date(parts[2], parts[1] - 1, parts[0]);
            const now = new Date();
            const today = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
            const todayStr = today.toLocaleDateString('en-IN', { year: 'numeric', month: '2-digit', day: '2-digit' });

            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toLocaleDateString('en-IN', { year: 'numeric', month: '2-digit', day: '2-digit' });

            if (dateKey === todayStr) return 'Today';
            if (dateKey === yesterdayStr) return 'Yesterday';

            return d.toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });
        }

        // ====== Fetch & Render ======
        async function fetchNews() {
            const container = document.getElementById('newsContent');

            try {
                const [topRes, newRes, bestRes] = await Promise.all([
                    fetch('https://hacker-news.firebaseio.com/v0/topstories.json'),
                    fetch('https://hacker-news.firebaseio.com/v0/newstories.json'),
                    fetch('https://hacker-news.firebaseio.com/v0/beststories.json')
                ]);

                const topIds = await topRes.json();
                const newIds = await newRes.json();
                const bestIds = await bestRes.json();

                const allIds = [...new Set([
                    ...topIds.slice(0, 150),
                    ...newIds.slice(0, 100),
                    ...bestIds.slice(0, 100)
                ])];

                // Fetch stories in batches
                const stories = [];
                const batchSize = 50;
                for (let i = 0; i < allIds.length; i += batchSize) {
                    const batch = allIds.slice(i, i + batchSize);
                    const batchResults = await Promise.all(
                        batch.map(id =>
                            fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`)
                                .then(r => r.json())
                                .catch(() => null)
                        )
                    );
                    stories.push(...batchResults.filter(Boolean));
                }

                // Filter AI stories
                const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
                const aiStories = stories.filter(s => {
                    if (!s || !s.title || !s.time) return false;
                    if (s.time * 1000 < sevenDaysAgo) return false;
                    const t = s.title.toLowerCase();
                    return AI_KEYWORDS.some(kw => t.includes(kw));
                });

                // Score and sort
                const scored = aiStories.map(s => ({
                    ...s,
                    smartScore: scoreStory(s),
                    dateKey: toISTDateStr(s.time)
                }));

                // Group by day
                const grouped = {};
                scored.forEach(s => {
                    if (!grouped[s.dateKey]) grouped[s.dateKey] = [];
                    grouped[s.dateKey].push(s);
                });

                // Sort each day by score, keep top 5
                for (const key in grouped) {
                    grouped[key].sort((a, b) => b.smartScore - a.smartScore);
                    grouped[key] = grouped[key].slice(0, 5);
                }

                // Sort days newest first
                const sortedDays = Object.keys(grouped).sort((a, b) => {
                    const [dA, mA, yA] = a.split('/');
                    const [dB, mB, yB] = b.split('/');
                    return new Date(yB, mB - 1, dB) - new Date(yA, mA - 1, dA);
                });

                renderNews(sortedDays, grouped);

            } catch (err) {
                container.innerHTML = `
                    <div class="loading-container">
                        <p class="loading-text">Failed to load news. Please try again later.</p>
                    </div>`;
                console.error(err);
            }
        }

        function renderNews(days, grouped) {
            const container = document.getElementById('newsContent');

            if (days.length === 0) {
                container.innerHTML = `
                    <div class="loading-container">
                        <p class="loading-text">No AI stories found in the last 7 days.</p>
                    </div>`;
                return;
            }

            let html = '';

            days.forEach(dayKey => {
                const stories = grouped[dayKey];
                const label = formatDayLabel(dayKey);

                html += `<div class="day-section">`;
                html += `<div class="day-header">${label}</div>`;

                stories.forEach(story => {
                    const url = story.url || `https://news.ycombinator.com/item?id=${story.id}`;
                    const domain = getDomain(url) || 'news.ycombinator.com';
                    const grad = getGradient(domain);
                    const abbr = getDomainAbbr(domain);

                    // Build a short description from score + comments
                    const comments = story.descendants || 0;
                    const desc = `${story.score} points · ${comments} comment${comments !== 1 ? 's' : ''} on Hacker News`;

                    html += `
                        <a href="${url}" target="_blank" class="news-card">
                            <div class="card-thumb">
                                <div class="card-thumb-gradient" style="background: ${grad};">${abbr}</div>
                            </div>
                            <div class="card-body">
                                <div class="card-title">${story.title}</div>
                                <div class="card-desc">${desc}</div>
                                <div class="card-source">${domain}</div>
                            </div>
                        </a>
                    `;
                });

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        // Load on page visit
        fetchNews();
    </script>
</body>
