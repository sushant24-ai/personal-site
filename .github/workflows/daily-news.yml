name: Daily AI News Update

on:
  schedule:
    # 6 PM PST = 2 AM UTC next day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch daily AI news
        run: node scripts/fetch-news.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          git diff --cached --quiet || (git commit -m "📰 Daily AI News update $(date -u '+%Y-%m-%d')" && git push)
